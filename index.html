<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>walmartprodct — DEMO TEST</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080b12;color:#eef2f7}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.top{background:#0b0f18;border-bottom:1px solid #202737;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}
.demo{font-size:11px;border:1px solid #6c5ce7;color:#c9c1ff;border-radius:999px;padding:5px 8px}
.wrap{max-width:1180px;margin:auto;padding:22px 16px 70px}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:#101521;border:1px solid #202737;border-radius:18px;padding:18px}
.muted{color:#8993a6;font-size:13px}
.value{font-size:26px;font-weight:800;margin-top:8px}
.nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;border-bottom:1px solid #202737}
.nav button{background:transparent;color:#aeb7c7;padding:10px 12px;border-radius:10px;white-space:nowrap}
.nav button:hover{background:#171e2c;color:white}
.primary{background:#7c5cff;color:white;padding:11px 15px;border-radius:11px}
.danger{background:#3a1820;color:#ffb4bd;padding:10px 12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center}
.input{width:100%;background:#0b0f18;border:1px solid #293244;color:white;padding:12px;border-radius:10px;margin:6px 0 12px}
.auth{max-width:430px;margin:8vh auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #222b3a;font-size:13px}
.pill{padding:4px 8px;border-radius:999px;background:#182132;color:#bfc8d8;font-size:11px}
.positive{color:#73e0a0}
.notice{background:#17132b;border:1px solid #40347c;padding:12px;border-radius:12px;margin-bottom:15px;color:#d8d1ff}
.qr{height:130px;width:130px;border:1px dashed #58637a;border-radius:12px;display:grid;place-items:center;color:#7f8ba0}
</style>
</head>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://ulvmypfkobqngnwoiqpe.supabase.co";
const SUPABASE_KEY="sb_publishable_O5vR_kJEU_fQdM6KwX8oSQ_deSx96O9";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

function getData(userId){

let d=localStorage.getItem("demo_"+userId);

if(!d){

d={
USDT:0,
ETH:0,
transactions:[]
};

localStorage.setItem("demo_"+userId,JSON.stringify(d));

}

return d;

}

function saveData(userId,d){

localStorage.setItem("demo_"+userId,JSON.stringify(d));

}

function shell(body){

return `
<div class="top">
<div class="brand">
walmartprodct
<span class="demo">DEMO / TEST</span>
</div>

<div class="row">
<button class="danger" onclick="logout()">Logout</button>
</div>
</div>

<div class="nav">
<button onclick="page('home')">Home</button>
<button onclick="page('wallet')">Wallet</button>
<button onclick="page('deposit')">Deposit</button>
<button onclick="page('withdraw')">Withdraw</button>
<button onclick="page('tx')">Transactions</button>
<button onclick="page('profile')">Profile</button>
<button onclick="page('terms')">Terms</button>
</div>

<div class="wrap">
${body}
</div>
`;

}

function login(){

document.querySelector("#app").innerHTML=`

<div class="wrap auth">
<div class="card">

<h1>Welcome back</h1>

<p class="muted">
DEMO/TEST crypto dashboard
</p>

<input id="email" class="input" placeholder="Email">

<input id="pw" type="password" class="input" placeholder="Password">

<button class="primary" onclick="doLogin()">
Login
</button>

<p id="msg" class="muted"></p>

<p>
New demo user?
<a href="#register" style="color:#a998ff">
Register
</a>
</p>

</div>
</div>

`;

}

async function doLogin(){

try{

const{error}=await sb.auth.signInWithPassword({

email:$("#email").value,

password:$("#pw").value

});

if(error)throw error;

location.hash="home";

render();

}catch(e){

$("#msg").textContent=e.message;

}

}

function register(){

document.querySelector("#app").innerHTML=`

<div class="wrap auth">
<div class="card">

<h1>Create demo account</h1>

<div class="notice">
This creates a test account only.
No real crypto is deposited or withdrawn.
</div>

<input id="name" class="input" placeholder="Full name">

<input id="email" class="input" placeholder="Email">

<input id="pw" type="password" class="input" placeholder="Password 6+ characters">

<button class="primary" onclick="doRegister()">
Create account
</button>

<p id="msg" class="muted"></p>

<p>
<a href="#login" style="color:#a998ff">
Back to login
</a>
</p>

</div>
</div>

`;

}

async function doRegister(){

try{

const email=$("#email").value;
const password=$("#pw").value;
const name=$("#name").value;

const{data,error}=await sb.auth.signUp({

email:email,

password:password,

options:{
data:{name:name},
emailRedirectTo:location.origin+location.pathname
}

});

if(error)throw error;

if(data.session){

location.hash="home";
render();

}else{

$("#msg").textContent=
"Account created. Please check your email to confirm your account.";

}

}catch(e){

$("#msg").textContent=e.message;

}

}

async function logout(){

await sb.auth.signOut();

location.hash="login";

render();

}

async function currentUser(){

const{data}=await sb.auth.getUser();

return data.user;

}

async function home(){

const user=await currentUser();

if(!user){

location.hash="login";

return render();

}

const d=getData(user.id);

document.querySelector("#app").innerHTML=shell(`

<div class="notice">

<b>DEMO / TEST PLATFORM</b>

All balances and transactions shown here are simulated.

No real cryptocurrency is deposited or withdrawn.

</div>

<div class="between">

<div>

<h1>
Hi ${esc(user.user_metadata?.name||user.email)} 👋
</h1>

<p class="muted">
Your test portfolio overview
</p>

</div>

<div class="row">

<button class="primary" onclick="page('deposit')">
Deposit
</button>

<button class="primary" onclick="page('withdraw')">
Withdraw
</button>

</div>

</div>

<div class="grid cards">

<div class="card">

<div class="muted">
USDT Demo Balance
</div>

<div class="value">
${Number(d.USDT).toFixed(2)}
</div>

</div>

<div class="card">

<div class="muted">
ETH Demo Balance
</div>

<div class="value">
${Number(d.ETH).toFixed(6)}
</div>

</div>

<div class="card">

<div class="muted">
Transactions
</div>

<div class="value">
${d.transactions.length}
</div>

</div>

</div>

<div class="card" style="margin-top:14px">

<h3>
Recent Transactions
</h3>

<table class="table">

<tr>
<th>Type</th>
<th>Currency</th>
<th>Amount</th>
<th>Status</th>
</tr>

${d.transactions.slice(-5).reverse().map(t=>`

<tr>
<td>${esc(t.type)}</td>
<td>${esc(t.currency)}</td>
<td>${esc(t.amount)}</td>
<td>
<span class="pill">
${esc(t.status)}
</span>
</td>
</tr>

`).join("")||`

<tr>
<td colspan="4">
No transactions yet
</td>
</tr>

`}

</table>

</div>

`);

}

function wallet(){

currentUser().then(user=>{

if(!user)return page("login");

const d=getData(user.id);

document.querySelector("#app").innerHTML=shell(`

<h1>Wallet & Balances</h1>

<p class="muted">
TEST balances only
</p>

<div class="grid cards">

<div class="card">

<div class="muted">
USDT
</div>

<div class="value">
${Number(d.USDT).toFixed(2)}
</div>

<span class="pill">
DEMO
</span>

</div>

<div class="card">

<div class="muted">
ETH
</div>

<div class="value">
${Number(d.ETH).toFixed(6)}
</div>

<span class="pill">
DEMO
</span>

</div>

</div>

`);

});

}

function deposit(){

document.querySelector("#app").innerHTML=shell(`

<h1>Demo Deposit</h1>

<div class="notice">
No real blockchain transaction is created.
This is only a simulated test deposit.
</div>

<div class="card">

<label>Currency</label>

<select id="cur" class="input">

<option>USDT</option>
<option>ETH</option>

</select>

<label>Amount</label>

<input id="amt" class="input" type="number" min="0" step="any" placeholder="0.00">

<div class="qr">
DEMO QR
</div>

<p class="muted">
This is a simulated demo address.
</p>

<button class="primary" onclick="makeDeposit()">
Create simulated deposit
</button>

</div>

`);

}

async function makeDeposit(){

const user=await currentUser();

if(!user)return page("login");

const amount=Number($("#amt").value);

const currency=$("#cur").value;

if(!amount||amount<=0){

alert("Enter a valid amount");

return;

}

const d=getData(user.id);

d[currency]+=amount;

d.transactions.push({

type:"Deposit",

currency:currency,

amount:amount,

status:"completed",

date:new Date().toISOString()

});

saveData(user.id,d);

alert("Simulated deposit created");

page("tx");

}

function withdraw(){

currentUser().then(user=>{

if(!user)return page("login");

const d=getData(user.id);

document.querySelector("#app").innerHTML=shell(`

<h1>Demo Withdrawal</h1>

<div class="notice">
Withdrawals never send cryptocurrency.
This is only a simulated test workflow.
</div>

<div class="card">

<label>Currency</label>

<select id="cur" class="input">

<option>USDT</option>
<option>ETH</option>

</select>

<label>Amount</label>

<input id="amt" class="input" type="number" min="0" step="any" placeholder="0.00">

<label>Destination wallet address</label>

<input id="addr" class="input" placeholder="DEMO-WALLET-ADDRESS">

<button class="primary" onclick="makeWithdraw()">
Submit simulated withdrawal
</button>

</div>

`);

});

}

async function makeWithdraw(){

const user=await currentUser();

if(!user)return page("login");

const currency=$("#cur").value;

const amount=Number($("#amt").value);

const address=$("#addr").value.trim();

const d=getData(user.id);

if(!amount||amount<=0){

alert("Enter a valid amount");

return;

}

if(!address){

alert("Enter a demo wallet address");

return;

}

if(amount>d[currency]){

alert("Insufficient demo balance");

return;

}

d[currency]-=amount;

d.transactions.push({

type:"Withdrawal",

currency:currency,

amount:amount,

status:"pending",

date:new Date().toISOString()

});

saveData(user.id,d);

alert("Simulated withdrawal is now Pending");

page("tx");

}

async function tx(){

const user=await currentUser();

if(!user)return page("login");

const d=getData(user.id);

document.querySelector("#app").innerHTML=shell(`

<h1>Transactions</h1>

<div class="card">

<table class="table">

<tr>
<th>Date</th>
<th>Type</th>
<th>Currency</th>
<th>Amount</th>
<th>Status</th>
</tr>

${d.transactions.slice().reverse().map(t=>`

<tr>

<td>
${new Date(t.date).toLocaleString()}
</td>

<td>
${esc(t.type)}
</td>

<td>
${esc(t.currency)}
</td>

<td>
${esc(t.amount)}
</td>

<td>
<span class="pill">
${esc(t.status)}
</span>
</td>

</tr>

`).join("")||`

<tr>
<td colspan="5">
No transactions
</td>
</tr>

`}

</table>

</div>

`);

}

async function profile(){

const user=await currentUser();

if(!user)return page("login");

document.querySelector("#app").innerHTML=shell(`

<h1>Profile & Security</h1>

<div class="card">

<h3>
${esc(user.user_metadata?.name||"Demo User")}
</h3>

<p class="muted">
${esc(user.email)}
</p>

<p>
Status
<span class="pill">
Demo account
</span>
</p>

<p class="muted">
Authentication is handled by Supabase.
This is a demo environment.
</p>

</div>

`);

}

function terms(){

document.querySelector("#app").innerHTML=shell(`

<h1>Terms & Privacy</h1>

<div class="card">

<p>
This demo platform does not custody funds
or execute real cryptocurrency withdrawals.
</p>

<p>
All balances transactions deposits and withdrawals
are simulated test data.
</p>

<p class="muted">
Never enter real private keys or seed phrases.
</p>

</div>

`);

}

function page(p){

location.hash=p;

render();

}

async function render(){

const h=location.hash.slice(1)||"login";

if(h==="login")return login();

if(h==="register")return register();

if(h==="home")return home();

if(h==="wallet")return wallet();

if(h==="deposit")return deposit();

if(h==="withdraw")return withdraw();

if(h==="tx")return tx();

if(h==="profile")return profile();

if(h==="terms")return terms();

location.hash="login";

login();

}

window.addEventListener("hashchange",render);

render();

</script>

</body>
</html>
