<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETHIO — Crypto Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff}a{color:#a998ff;text-decoration:none}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#141b2d;border:1px solid #27314a;border-radius:18px;padding:22px;margin:14px 0}.muted{color:#9ca8bd}.input{width:100%;padding:14px;margin:8px 0;background:#0d1424;color:#fff;border:1px solid #34405d;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:13px 18px;font-size:16px}.primary{background:#8d78ff;color:white;width:100%;margin-top:8px}.secondary{background:#27314a;color:white}.danger{background:#5d2630;color:white}.notice{background:#201d36;border:1px solid #544a86;padding:12px;border-radius:10px;margin:12px 0;color:#d9d3ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.balance{font-size:28px;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.center{text-align:center}.small{font-size:13px}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL="https://ulvmypfkobqngnwoiqpe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Yljia5UnGwKkT8vOHLEgWQ_K6ZOQF_X";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app");
<script>
async function showDashboard(){
  const {data:{user}}=await sb.auth.getUser();

  if(!user){
    app.innerHTML=`
      <h1>ETHIO</h1>
      <p>Secure Crypto Platform</p>
      <button onclick="showLogin()">Sign In</button>
      <button onclick="showRegister()">Create Account</button>`;
    return;
  }

  const {data:wallets,error}=await sb
    .from("wallets")
    .select("asset,balance")
    .eq("user_id",user.id);

  if(error){
    app.innerHTML="<h2>Unable to load wallet</h2>";
    return;
  }

  const eth=wallets.find(w=>w.asset==="ETH");
  const usdt=wallets.find(w=>w.asset==="USDT");

  app.innerHTML=`
    <h1>ETHIO</h1>
    <p>Welcome</p>

    <div>
      <h3>ETH</h3>
      <h2>${Number(eth?.balance||0).toFixed(8)}</h2>
    </div>

    <div>
      <h3>USDT</h3>
      <h2>${Number(usdt?.balance||0).toFixed(2)}</h2>
    </div>

    <button onclick="sb.auth.signOut().then(showDashboard)">
      Logout
    </button>
  `;
}

async function showLogin(){
  app.innerHTML=`
    <h1>ETHIO Sign In</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <button onclick="showRegister()">Create Account</button>`;
}

async function login(){
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById("email").value,
    password:document.getElementById("password").value
  });

  if(error){
    alert(error.message);
    return;
  }

  showDashboard();
}

async function showRegister(){
  app.innerHTML=`
    <h1>Create ETHIO Account</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="register()">Create Account</button>
    <button onclick="showLogin()">Sign In</button>`;
}

async function register(){
  const {error}=await sb.auth.signUp({
    email:document.getElementById("email").value,
    password:document.getElementById("password").value
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Account created successfully");
  showLogin();
}

showDashboard();
</script>
